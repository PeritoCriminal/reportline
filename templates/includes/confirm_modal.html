{# Modal global de confirmação para ações destrutivas ou irreversíveis #}
<div class="modal fade"
     id="confirmActionModal"
     tabindex="-1"
     aria-labelledby="confirmActionModalLabel"
     aria-describedby="confirmActionModalMessage"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-secondary-subtle">
                <h2 class="modal-title fs-5" id="confirmActionModalLabel">
                    <i class="bi bi-exclamation-triangle-fill text-warning me-2" aria-hidden="true"></i>
                    <span data-confirm-modal-title>Confirmar ação</span>
                </h2>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0" id="confirmActionModalMessage" data-confirm-modal-message>
                    Tem certeza que deseja continuar?
                </p>
                <p class="mb-0 mt-2 fw-semibold d-none" data-confirm-modal-detail></p>
            </div>
            <div class="modal-footer border-secondary-subtle">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button" class="btn btn-danger" data-confirm-modal-submit>
                    Confirmar
                </button>
            </div>
        </div>
    </div>
</div>
