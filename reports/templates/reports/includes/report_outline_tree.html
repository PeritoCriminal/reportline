{% load report_outline %}
{% if outline_tree %}
<ul class="report-editor-outline{% if outline_tree|outline_list_reorderable %} report-editor-outline-siblings{% endif %}"
    role="tree"
    {% if outline_tree|outline_list_reorderable %}data-node-parent-id="{{ outline_tree|outline_sibling_parent_id }}"{% endif %}>
    {% for entry in outline_tree %}
        {% include "reports/includes/report_outline_item.html" with entry=entry reorderable=outline_tree|outline_list_reorderable %}
    {% endfor %}
</ul>
{% else %}
<p class="report-editor-outline-empty mb-0">Nenhum título no sumário.</p>
{% endif %}
