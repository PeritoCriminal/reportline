{# reportline/reports/templates/reports/includes/report_page_header_extra_rows_read.html #}
{% load report_inline_text %}
{% for row in header.extra_rows %}
    <div class="report-page-header-extra-row">
        {% if row.type == "rule" %}
            <hr class="report-page-header-extra-rule" aria-hidden="true">
        {% else %}
            <div class="report-page-header-extra-row-inner"
                 style="text-align: {{ row.align|default:'left' }};">
                <div class="report-page-header-text report-page-header-text--read report-page-header-extra-text{% if row.muted %} report-page-header-extra-text--muted{% endif %}"
                     data-text-align="{{ row.align|default:'left' }}"
                     data-indent-level="{{ row.indent_level|default:0 }}"
                     data-first-line-indent="{% if row.first_line_indent %}true{% else %}false{% endif %}">{{ row.text|default:""|header_text }}</div>
            </div>
        {% endif %}
    </div>
{% endfor %}
