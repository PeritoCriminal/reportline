{% comment %}
Barra de ferramentas do editor com os tipos de bloco suportados por ReportBlock.
Os botões ficam desabilitados até a camada interativa de inserção ser implementada.
{% endcomment %}
<div class="report-editor-toolbar" role="toolbar" aria-label="Inserir bloco">
    <button type="button" class="btn btn-outline-secondary btn-toolbar-block" disabled
            data-block-type="heading" title="Título" aria-label="Inserir título">
        <i class="bi bi-type-h1" aria-hidden="true"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-toolbar-block" disabled
            data-block-type="paragraph" title="Parágrafo" aria-label="Inserir parágrafo">
        <i class="bi bi-text-paragraph" aria-hidden="true"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-toolbar-block" disabled
            data-block-type="ordered_list" title="Lista numerada" aria-label="Inserir lista numerada">
        <i class="bi bi-list-ol" aria-hidden="true"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-toolbar-block" disabled
            data-block-type="unordered_list" title="Lista com marcadores" aria-label="Inserir lista com marcadores">
        <i class="bi bi-list-ul" aria-hidden="true"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-toolbar-block" disabled
            data-block-type="link" title="Link" aria-label="Inserir link">
        <i class="bi bi-link-45deg" aria-hidden="true"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-toolbar-block" disabled
            data-block-type="table" title="Tabela" aria-label="Inserir tabela">
        <i class="bi bi-table" aria-hidden="true"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-toolbar-block" disabled
            data-block-type="image" title="Imagem" aria-label="Inserir imagem">
        <i class="bi bi-image" aria-hidden="true"></i>
    </button>
</div>
