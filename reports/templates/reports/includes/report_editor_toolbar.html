{% comment %}
Barra de ferramentas do editor: título, status e inserção de blocos.
{% endcomment %}
<div class="report-editor-toolbar" role="toolbar" aria-label="Ferramentas do editor">
    <div class="report-editor-toolbar-blocks">
        <button type="button" class="btn btn-outline-secondary btn-toolbar-block"
                data-insert-block-type="heading" title="Título" aria-label="Inserir título">
            <i class="bi bi-type-h1" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary btn-toolbar-block"
                data-insert-block-type="paragraph" title="Parágrafo" aria-label="Inserir parágrafo">
            <i class="bi bi-text-paragraph" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary btn-toolbar-block"
                data-insert-block-type="ordered_list" title="Lista numerada" aria-label="Inserir lista numerada">
            <i class="bi bi-list-ol" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary btn-toolbar-block"
                data-insert-block-type="unordered_list" title="Lista com marcadores" aria-label="Inserir lista com marcadores">
            <i class="bi bi-list-ul" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary btn-toolbar-block"
                data-insert-block-type="link" title="Link" aria-label="Inserir link">
            <i class="bi bi-link-45deg" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary btn-toolbar-block"
                data-insert-block-type="table" title="Tabela" aria-label="Inserir tabela">
            <i class="bi bi-table" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary btn-toolbar-block"
                data-insert-block-type="image" title="Imagem" aria-label="Inserir imagem">
            <i class="bi bi-image" aria-hidden="true"></i>
        </button>
    </div>
    <div class="report-editor-toolbar-meta ms-auto">
        <span class="report-editor-toolbar-title text-truncate">{{ report.title }}</span>
        <span class="badge text-bg-secondary">{{ report.get_status_display }}</span>
    </div>
</div>
