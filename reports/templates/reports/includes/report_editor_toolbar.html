{% comment %}
Barra de ferramentas do editor: blocos, formatação inline e ações do documento.
{% endcomment %}
<div class="report-editor-toolbar" role="toolbar" aria-label="Ferramentas do editor">
    <div class="report-editor-toolbar-groups">
        {# 1 — Blocos #}
        <div class="report-editor-toolbar-group" role="group" aria-label="Inserir blocos">
            <div class="btn-group report-editor-toolbar-heading-group">
                <button type="button"
                        class="btn btn-outline-secondary btn-toolbar-block btn-toolbar-heading-main"
                        data-insert-block-type="heading"
                        data-title-level="0"
                        title="Aplicar título nível 1"
                        aria-label="Aplicar título nível 1">
                    <span class="report-editor-toolbar-heading-letter" aria-hidden="true">T</span>
                </button>
                <button type="button"
                        class="btn btn-outline-secondary btn-toolbar-block btn-toolbar-heading-toggle dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                        title="Escolher nível do título"
                        aria-label="Escolher nível do título">
                    <span class="visually-hidden">Escolher nível do título</span>
                </button>
                <ul class="dropdown-menu">
                    <li>
                        <button type="button"
                                class="dropdown-item"
                                data-insert-block-type="heading"
                                data-title-level="0">
                            Título 1
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item"
                                data-insert-block-type="heading"
                                data-title-level="1">
                            Título 2
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item"
                                data-insert-block-type="heading"
                                data-title-level="2">
                            Título 3
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item"
                                data-insert-block-type="heading"
                                data-title-level="3">
                            Título 4
                        </button>
                    </li>
                </ul>
            </div>
            <div class="btn-group report-editor-toolbar-paragraph-group">
                <button type="button"
                        class="btn btn-outline-secondary btn-toolbar-block btn-toolbar-paragraph-main"
                        data-insert-block-type="paragraph"
                        title="Parágrafo"
                        aria-label="Inserir parágrafo">
                    <i class="bi bi-text-paragraph" aria-hidden="true"></i>
                </button>
                <button type="button"
                        class="btn btn-outline-secondary btn-toolbar-block btn-toolbar-paragraph-toggle dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown"
                        data-report-paragraph-options-toggle
                        aria-expanded="false"
                        title="Opções do parágrafo"
                        aria-label="Opções do parágrafo"
                        disabled>
                    <span class="visually-hidden">Opções do parágrafo</span>
                </button>
                <ul class="dropdown-menu report-editor-toolbar-paragraph-menu">
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-paragraph-indent="increase">
                            <i class="bi bi-text-indent-left" aria-hidden="true"></i>
                            Aumentar recuo
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-paragraph-indent="decrease">
                            <i class="bi bi-text-indent-right" aria-hidden="true"></i>
                            Diminuir recuo
                        </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-paragraph-first-line-indent>
                            <i class="bi bi-check2 report-editor-paragraph-menu-check" aria-hidden="true"></i>
                            Recuo da primeira linha
                        </button>
                    </li>
                </ul>
            </div>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-insert-block-type="ordered_list"
                    title="Lista numerada"
                    aria-label="Inserir lista numerada">
                <i class="bi bi-list-ol" aria-hidden="true"></i>
            </button>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-insert-block-type="unordered_list"
                    title="Lista com marcadores"
                    aria-label="Inserir lista com marcadores">
                <i class="bi bi-list-ul" aria-hidden="true"></i>
            </button>
            <div class="btn-group report-editor-toolbar-table-group">
                <button type="button"
                        class="btn btn-outline-secondary btn-toolbar-block btn-toolbar-table-main"
                        data-report-table-insert
                        title="Inserir tabela"
                        aria-label="Inserir tabela">
                    <i class="bi bi-table" aria-hidden="true"></i>
                </button>
                <button type="button"
                        class="btn btn-outline-secondary btn-toolbar-block btn-toolbar-table-toggle dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown"
                        data-report-table-options-toggle
                        aria-expanded="false"
                        title="Opções da tabela"
                        aria-label="Opções da tabela"
                        disabled>
                    <span class="visually-hidden">Opções da tabela</span>
                </button>
                <ul class="dropdown-menu report-editor-toolbar-table-menu">
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-add-row>
                            <span class="report-editor-toolbar-table-glyph report-editor-toolbar-table-glyph-row-add"
                                  aria-hidden="true"></span>
                            Inserir linha abaixo
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-add-col>
                            <span class="report-editor-toolbar-table-glyph report-editor-toolbar-table-glyph-col-add"
                                  aria-hidden="true"></span>
                            Inserir coluna à direita
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-delete-row>
                            <span class="report-editor-toolbar-table-glyph report-editor-toolbar-table-glyph-row-remove"
                                  aria-hidden="true"></span>
                            Excluir linha
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-delete-col>
                            <span class="report-editor-toolbar-table-glyph report-editor-toolbar-table-glyph-col-remove"
                                  aria-hidden="true"></span>
                            Excluir coluna
                        </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-toggle-borders>
                            <span class="report-editor-toolbar-table-glyph report-editor-toolbar-table-glyph-borders-show"
                                  data-table-border-glyph="show"
                                  aria-hidden="true"></span>
                            <span class="report-editor-toolbar-table-glyph report-editor-toolbar-table-glyph-borders-hide"
                                  data-table-border-glyph="hide"
                                  hidden
                                  aria-hidden="true"></span>
                            <span data-table-border-label="show">Mostrar linhas da tabela</span>
                            <span data-table-border-label="hide" hidden>Ocultar linhas da tabela</span>
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-toggle-header>
                            <span class="report-editor-toolbar-table-glyph report-editor-toolbar-table-glyph-header-show"
                                  data-table-header-glyph="show"
                                  aria-hidden="true"></span>
                            <span class="report-editor-toolbar-table-glyph report-editor-toolbar-table-glyph-header-hide"
                                  data-table-header-glyph="hide"
                                  hidden
                                  aria-hidden="true"></span>
                            <span data-table-header-label="show">Mostrar cabeçalho da tabela</span>
                            <span data-table-header-label="hide" hidden>Ocultar cabeçalho da tabela</span>
                        </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-align="left">
                            <i class="bi bi-text-left" aria-hidden="true"></i>
                            Alinhar à esquerda
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-align="center">
                            <i class="bi bi-text-center" aria-hidden="true"></i>
                            Alinhar ao centro
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-table-align="right">
                            <i class="bi bi-text-right" aria-hidden="true"></i>
                            Alinhar à direita
                        </button>
                    </li>
                </ul>
            </div>
            <div class="btn-group report-editor-toolbar-image-group">
                <button type="button"
                        class="btn btn-outline-secondary btn-toolbar-block btn-toolbar-image-main"
                        data-report-image-insert
                        title="Imagem"
                        aria-label="Inserir imagem">
                    <i class="bi bi-image" aria-hidden="true"></i>
                </button>
                <button type="button"
                        class="btn btn-outline-secondary btn-toolbar-block btn-toolbar-image-toggle dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown"
                        data-report-image-options-toggle
                        aria-expanded="false"
                        title="Opções da imagem"
                        aria-label="Opções da imagem"
                        disabled>
                    <span class="visually-hidden">Opções da imagem</span>
                </button>
                <ul class="dropdown-menu report-editor-toolbar-image-menu">
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-image-align="left">
                            <i class="bi bi-text-left" aria-hidden="true"></i>
                            Alinhar à esquerda
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-image-align="center">
                            <i class="bi bi-text-center" aria-hidden="true"></i>
                            Alinhar ao centro
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-report-image-align="right">
                            <i class="bi bi-text-right" aria-hidden="true"></i>
                            Alinhar à direita
                        </button>
                    </li>
                </ul>
            </div>
        </div>

        <div class="report-editor-toolbar-divider" aria-hidden="true"></div>

        {# 2 — Alinhamento #}
        <div class="report-editor-toolbar-group" role="group" aria-label="Alinhamento">
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-align="right"
                    title="Alinhar à direita"
                    aria-label="Alinhar à direita"
                    aria-pressed="false">
                <i class="bi bi-text-right" aria-hidden="true"></i>
            </button>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-align="center"
                    title="Centralizar"
                    aria-label="Centralizar"
                    aria-pressed="false">
                <i class="bi bi-text-center" aria-hidden="true"></i>
            </button>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-align="left"
                    title="Alinhar à esquerda"
                    aria-label="Alinhar à esquerda"
                    aria-pressed="false">
                <i class="bi bi-text-left" aria-hidden="true"></i>
            </button>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-align="justify"
                    title="Justificar"
                    aria-label="Justificar"
                    aria-pressed="false">
                <i class="bi bi-justify" aria-hidden="true"></i>
            </button>
        </div>

        <div class="report-editor-toolbar-divider" aria-hidden="true"></div>

        {# 3 — Formatação inline #}
        <div class="report-editor-toolbar-group report-editor-toolbar-format-group" role="group" aria-label="Formatação de texto">
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-format="bold"
                    title="Negrito (Ctrl+B)"
                    aria-label="Negrito"
                    aria-pressed="false"
                    disabled>
                <i class="bi bi-type-bold" aria-hidden="true"></i>
            </button>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-format="italic"
                    title="Itálico (Ctrl+I)"
                    aria-label="Itálico"
                    aria-pressed="false"
                    disabled>
                <i class="bi bi-type-italic" aria-hidden="true"></i>
            </button>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-format="underline"
                    title="Sublinhado (Ctrl+U)"
                    aria-label="Sublinhado"
                    aria-pressed="false"
                    disabled>
                <i class="bi bi-type-underline" aria-hidden="true"></i>
            </button>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-format="strikethrough"
                    title="Riscado (Ctrl+Shift+X)"
                    aria-label="Riscado"
                    aria-pressed="false"
                    disabled>
                <i class="bi bi-type-strikethrough" aria-hidden="true"></i>
            </button>
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    data-report-text-link
                    title="Inserir link"
                    aria-label="Inserir link"
                    disabled>
                <i class="bi bi-link-45deg" aria-hidden="true"></i>
            </button>
        </div>

        <div class="report-editor-toolbar-divider" aria-hidden="true"></div>

        {# 5 — Ações do documento #}
        <div class="report-editor-toolbar-group" role="group" aria-label="Ações do relatório">
            <button type="button"
                    class="btn btn-outline-secondary btn-toolbar-block"
                    disabled
                    title="Gerar PDF"
                    aria-label="Gerar PDF">
                <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>
            </button>
            <a class="btn btn-outline-secondary btn-toolbar-block"
               href="{% url 'reports:list' %}"
               title="Voltar à lista"
               aria-label="Voltar à lista de relatórios">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
            </a>
        </div>
    </div>

    <div class="report-editor-toolbar-meta ms-auto">
        <span class="report-editor-toolbar-title text-truncate">{{ report.title }}</span>
        <span class="badge text-bg-secondary">{{ report.get_status_display }}</span>
    </div>
</div>
